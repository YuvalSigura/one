[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "one-mcp"
version = "0.1.0"
description = "Local MCP coordination bridge for Grok Bot, Grok CLI, Claude Code and Codex"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
one-mcp = "one_mcp.server:main"
one = "one_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
